<div class="auth-container">
    <h2 class="loginHeading">Log In - SkiFitter</h2>
    <p>Welcome back to SkiFitter!</p>
    <!--using Reactive forms to take advantage of angulars built in help-->
    <form [formGroup]="userDetails" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline">
            <label for="email">Email:</label>
            <input matInput id="email" type="email" formControlName="email" />
        </mat-form-field>
        <mat-form-field appearance="outline">
            <label for="password">Password:</label>
            <input matInput id="password" type="password" formControlName="password" />
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit" [disabled]="userDetails.invalid">Log In</button>
    </form>
    <p>Never created an account?... Register <a href="/register">HERE</a></p>
</div>
