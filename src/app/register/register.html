<div class = "auth-container">
    <h2 class = "registerHeading">Register - SkiFitter</h2>
       <p>Welcome to SkiFitter!</p>
       <!--using Reactive forms to take advantage of angulars built in help-->
       <form [formGroup]="registerUser" (ngSubmit)="onSubmit()" class = "register-form">
        <mat-form-field appearance = "outline">
            <label for = "email">Email:</label>
            <input matInput id = "email" type = "email" formControlName = "email" />
        </mat-form-field>
        <mat-form-field appearance = "outline">
            <label for = "firstName">First Name:</label>
            <input matInput id = "firstName" type = "text" formControlName = "firstName" />
        </mat-form-field>
        <mat-form-field appearance = "outline">
            <label for = "secondName">Second Name:</label>
            <input matInput id = "secondName" type = "text" formControlName = "lastName" />
        </mat-form-field>
        <mat-form-field appearance = "outline">
            <label for = "password">Password:</label>
            <input matInput id = "password" type = "password" formControlName = "password" />
        </mat-form-field>
        <button mat-flat-button color = "primary" type = "submit" [disabled] = "registerUser.invalid">Register</button>
       </form>
       <p>Already Registered?... Log In <a href="/login">HERE</a></p>
</div>
