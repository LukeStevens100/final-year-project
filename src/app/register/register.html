<div class = "auth-container">
    <h2>Register</h2>
       <p>Welcome to "placeholder"!</p>
       <p>Please enter your details below to register!</p>
       <!--using Reactive forms to take advantage of angulars built in help-->
       <form [formGroup]="registerUser">
        <div>
            <label>Email:</label>
            <input type = "email" formControlName = "email" />
        </div>
        <div>
            <label>First Name:</label>
            <input type = "text" formControlName = "firstName" />
        </div>
        <div>
            <label>Second Name:</label>
            <input type = "text" formControlName = "lastName" />
        </div>
        <div>
            <label>Password:</label>
            <input type = "password" formControlName = "password" />
        </div>
        <button type = "submit" [disabled] = "registerUser.invalid">Register</button>
       </form>
       <p>If you have never created an account... Log In <a href="/login">HERE</a></p>
</div>
